<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRMA - Food Delivery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0a9900'
                    }
                }
            }
        }
    </script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        body.telegram { background: var(--tg-theme-bg-color, #f9fafb); color: var(--tg-theme-text-color, #1f2937); }
        body.telegram header { background: var(--tg-theme-secondary-bg-color, #ffffff); }
        body.telegram .bg-white { background-color: var(--tg-theme-secondary-bg-color, #ffffff); }
        body.telegram .bg-gray-50, body.telegram .bg-green-50 { background-color: var(--tg-theme-bg-color, #f9fafb); }
        body.telegram .text-gray-900, body.telegram .text-gray-800 { color: var(--tg-theme-text-color, #1f2937); }
        body.telegram .text-gray-600, body.telegram .text-gray-500, body.telegram .text-gray-400 { color: var(--tg-theme-hint-color, #6b7280); }
        body.telegram .border-gray-100, body.telegram .border-gray-200, body.telegram .border-gray-300 { border-color: var(--tg-theme-hint-color, #d1d5db); }
        body.telegram input, body.telegram select { background: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #1f2937); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white shadow-sm border-b border-gray-100 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <img src="images/firma-logo.png" alt="FIRMA Logo" class="w-6 h-6 object-contain">
            <h1 class="font-bold text-lg text-gray-900">FIRMA</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button id="cart-btn" onclick="toggleCart()" class="relative bg-green-50 text-green-600 px-3 py-2 rounded-full font-medium text-sm flex items-center space-x-1 hover:bg-green-100 transition">
                <span>🛒</span>
                <span id="cart-badge" class="hidden bg-primary text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4">

        <!-- STORE VIEW -->
        <div id="view-store">
            <!-- Banner -->
            <div class="bg-gradient-to-r from-primary to-green-700 rounded-2xl p-4 text-white mb-6 shadow-md">
                <h2 class="text-xl font-bold mb-1">Welcome to FIRMA!</h2>
                <p class="text-green-100 text-sm">Order fresh food instantly. No signup required!</p>
            </div>

            <!-- Active Order Status Tracker (if any) -->
            <div id="active-order-tracker" class="hidden bg-white border border-green-200 rounded-2xl p-4 mb-6 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-sm text-gray-900">Active Order #<span id="tracker-id"></span></h3>
                    <span id="tracker-status-badge" class="text-xs bg-green-100 text-green-700 font-bold px-2.5 py-1 rounded-full">Received</span>
                </div>
                <!-- Progress bar -->
                <div class="relative flex items-center justify-between my-4 px-2">
                    <div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-1 bg-gray-200 z-0"></div>
                    <div id="progress-line" class="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-primary z-0 transition-all duration-300" style="width: 0%"></div>
                    
                    <div class="step-dot z-10 flex flex-col items-center">
                        <div class="w-7 h-7 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold ring-4 ring-green-50">1</div>
                        <span class="text-[10px] mt-1 font-medium text-gray-600">Received</span>
                    </div>
                    <div class="step-dot z-10 flex flex-col items-center">
                        <div class="w-7 h-7 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center text-xs font-bold ring-4 ring-white">2</div>
                        <span class="text-[10px] mt-1 font-medium text-gray-600">On the way</span>
                    </div>
                    <div class="step-dot z-10 flex flex-col items-center">
                        <div class="w-7 h-7 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center text-xs font-bold ring-4 ring-white">3</div>
                        <span class="text-[10px] mt-1 font-medium text-gray-600">Arrived</span>
                    </div>
                    <div class="step-dot z-10 flex flex-col items-center">
                        <div class="w-7 h-7 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center text-xs font-bold ring-4 ring-white">4</div>
                        <span class="text-[10px] mt-1 font-medium text-gray-600">Delivered</span>
                    </div>
                </div>
                <button onclick="clearActiveOrder()" class="w-full text-center text-xs text-gray-400 hover:text-gray-600 mt-2">Dismiss Tracker</button>
            </div>

            <!-- Category Filter -->
            <div class="flex space-x-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
                <button onclick="filterMenu('all')" class="category-btn active px-4 py-1.5 rounded-full text-sm font-medium bg-primary text-white whitespace-nowrap shadow-sm">All</button>
                <button onclick="filterMenu('burgers')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 whitespace-nowrap">Burgers</button>
                <button onclick="filterMenu('pizza')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 whitespace-nowrap">Pizza</button>
                <button onclick="filterMenu('drinks')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 whitespace-nowrap">Drinks</button>
            </div>

            <!-- Menu Grid -->
            <div id="menu-grid" class="grid grid-cols-2 gap-3">
                <!-- Populated via JS -->
            </div>
        </div>

    </main>

    <!-- Cart / Checkout Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end transition-opacity">
        <div class="bg-white w-full max-w-sm h-full flex flex-col shadow-xl">
            <!-- Cart Header -->
            <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-bold text-lg text-gray-900">Your FIRMA Cart</h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>

            <!-- Cart Body -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Items list -->
                <div id="cart-items" class="space-y-2">
                    <!-- Cart items rendered here -->
                </div>

                <hr class="border-gray-100">

                <!-- Checkout Form -->
                <div class="space-y-3">
                    <h4 class="font-bold text-xs text-gray-700 uppercase tracking-wider">Delivery & Contact</h4>
                    <input type="text" id="customer-name" placeholder="Name" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-primary">
                    
                    <div class="grid grid-cols-2 gap-2">
                        <select id="comm-method" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:border-primary">
                            <option value="Telegram">Telegram Username</option>
                            <option value="Phone">Phone Number</option>
                        </select>
                        <input type="text" id="customer-contact" placeholder="Username / Phone" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-primary">
                    </div>

                    <input type="text" id="customer-location" placeholder="Delivery Address or Meetup Spot" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-primary">

                    <button type="button" id="share-phone-btn" onclick="sharePhone()" class="hidden w-full text-xs font-semibold text-primary border border-primary rounded-lg py-2 hover:bg-green-50">
                        📱 Share my phone number with the bot
                    </button>

                    <h4 class="font-bold text-xs text-gray-700 uppercase tracking-wider pt-2">Payment Method</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="border border-gray-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-primary transition has-[:checked]:border-primary has-[:checked]:bg-green-50">
                            <input type="radio" name="payment" value="cod" checked onchange="togglePaymentUI()" class="accent-primary mb-1">
                            <span class="text-xs font-bold">Cash on Arrival</span>
                        </label>
                        <label class="border border-gray-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-primary transition has-[:checked]:border-primary has-[:checked]:bg-green-50">
                            <input type="radio" name="payment" value="qr" onchange="togglePaymentUI()" class="accent-primary mb-1">
                            <span class="text-xs font-bold">QR Code Payment</span>
                        </label>
                    </div>

                    <!-- QR Code Payment Box -->
                    <div id="qr-payment-box" class="hidden bg-gray-50 p-3 rounded-xl border border-gray-200 text-center space-y-2">
                        <p class="text-xs text-gray-600 font-medium">Scan QR to pay & attach screenshot/invoice below:</p>
                        <div class="w-28 h-28 bg-white mx-auto border border-gray-200 rounded-lg flex items-center justify-center shadow-xs">
                            <img src="images/qr/default-qr.png" alt="QR Code" class="w-full h-full object-contain rounded-lg" onerror="this.parentElement.innerHTML='<span class=&quot;text-3xl&quot;>📱<br><span class=&quot;text-xs&quot;>QR Code</span></span>'">
                        </div>
                        <input type="file" id="payment-proof" accept="image/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
                    </div>
                </div>
            </div>

            <!-- Cart Footer -->
            <div class="p-4 border-t border-gray-100 bg-white">
                <div class="flex justify-between items-center mb-3 text-base font-bold">
                    <span>Total:</span>
                    <span id="cart-total" class="text-primary">$0.00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-primary hover:bg-green-700 text-white font-bold py-3 rounded-xl transition shadow-md text-center block">
                    Place Order 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Default Menu Data stored in localStorage if not present
        const defaultMenu = [
            { id: 1, name: 'Cheeseburger Deluxe', category: 'burgers', price: 8.99, image: '🍔' },
            { id: 2, name: 'Double Bacon Burger', category: 'burgers', price: 10.99, image: '🥓' },
            { id: 3, name: 'Pepperoni Pizza', category: 'pizza', price: 12.99, image: '🍕' },
            { id: 4, name: 'Margherita Pizza', category: 'pizza', price: 10.49, image: '🧀' },
            { id: 5, name: 'Crispy French Fries', category: 'snacks', price: 3.99, image: '🍟' },
            { id: 6, name: 'Ice Cold Cola', category: 'drinks', price: 2.49, image: '🥤' }
        ];

        function escapeHtml(value) {
            const node = document.createElement('div');
            node.textContent = String(value ?? '');
            return node.innerHTML.replace(/"/g, String.fromCharCode(38) + 'quot;').replace(/'/g, String.fromCharCode(38) + '#39;');
        }

        function getItemImage(item) {
            if (item.image.startsWith('http')) {
                return `<img src="${escapeHtml(item.image)}" class="w-full h-28 object-contain rounded-xl">`;
            }
            if (item.image.startsWith('images/')) {
                return `<img src="${escapeHtml(item.image)}" class="w-full h-28 object-contain rounded-xl">`;
            }
            return `<span class="text-4xl">${escapeHtml(item.image)}</span>`;
        }

        let menuItems = JSON.parse(localStorage.getItem('firma_menu')) || defaultMenu;
        let orders = JSON.parse(localStorage.getItem('firma_orders')) || [];
        let cart = [];
        let activeOrderId = localStorage.getItem('firma_active_order') || null;

        const API_BASE = 'https://firma-orders.etfifamobile.workers.dev';

        async function apiFetch(path, options = {}) {
            const response = await fetch(API_BASE + path, options);
            if (!response.ok) {
                const payload = await response.json().catch(() => ({}));
                throw new Error(payload.error || `Request failed (${response.status})`);
            }
            return response.json();
        }

        async function syncRemoteMenu() {
            try {
                const data = await apiFetch('/api/menu');
                if (Array.isArray(data.items) && data.items.length) {
                    menuItems = data.items;
                    localStorage.setItem('firma_menu', JSON.stringify(menuItems));
                    renderMenu();
                }
            } catch (error) {
                console.error('menu sync failed', error);
            }
        }

        const tg = window.Telegram?.WebApp;
        let tgUser = null;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.disableVerticalSwipes?.();
            document.body.classList.add('telegram');
            tg.setHeaderColor('secondary_bg_color');
            tg.setBackgroundColor('bg_color');

            const user = tg.initDataUnsafe?.user;
            if (user) {
                tgUser = { id: user.id, username: user.username || '' };
                document.getElementById('customer-name').value = [user.first_name, user.last_name].filter(Boolean).join(' ');
                document.getElementById('comm-method').value = 'Telegram';
                document.getElementById('customer-contact').value = user.username ? '@' + user.username : '';
            }

            if (tg.requestContact) {
                document.getElementById('share-phone-btn').classList.remove('hidden');
            }

            tg.BackButton?.onClick(() => {
                document.getElementById('cart-modal').classList.add('hidden');
                syncTelegramUI();
            });

            tg.MainButton?.onClick(() => {
                if (document.getElementById('cart-modal').classList.contains('hidden')) {
                    toggleCart();
                } else {
                    checkout();
                }
            });
        }

        function syncTelegramUI() {
            if (!tg) return;
            const modalOpen = !document.getElementById('cart-modal').classList.contains('hidden');
            const totalCount = cart.reduce((sum, i) => sum + i.qty, 0);

            if (totalCount === 0) {
                tg.MainButton?.hide();
            } else {
                tg.MainButton?.setText(modalOpen ? 'Place Order' : `Cart (${totalCount})`);
                tg.MainButton?.show();
            }

            if (modalOpen) {
                tg.BackButton?.show();
            } else {
                tg.BackButton?.hide();
            }

            if (totalCount > 0) tg.enableClosingConfirmation?.();
            else tg.disableClosingConfirmation?.();
        }

        function notify(message, kind) {
            const inTelegram = tg && tg.platform !== 'unknown';
            if (inTelegram) tg.showAlert(message);
            else alert(message);
            if (kind && tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred(kind);
        }

        function sharePhone() {
            if (!tg?.requestContact) {
                notify('Phone sharing is only available inside Telegram.', 'warning');
                return;
            }
            tg.requestContact(shared => {
                if (shared) notify('Phone number shared with the bot.', 'success');
                else notify('Phone number was not shared.', 'warning');
            });
        }

        // Save state to localStorage
        function saveOrders() {
            localStorage.setItem('firma_orders', JSON.stringify(orders));
        }

        // Render Store Menu
        function renderMenu(category = 'all') {
            const grid = document.getElementById('menu-grid');
            const filtered = category === 'all' ? menuItems : menuItems.filter(item => item.category === category);
            
            grid.innerHTML = filtered.map(item => `
                <div class="bg-white p-3 rounded-2xl shadow-xs border border-gray-100 flex flex-col justify-between">
                    <div>
                        <div class="w-full h-28 bg-green-50 rounded-xl flex items-center justify-center mb-2">
                            ${getItemImage(item)}
                        </div>
                        <h4 class="font-semibold text-sm text-gray-800 line-clamp-1">${escapeHtml(item.name)}</h4>
                    </div>
                    <div class="mt-3 flex items-center justify-between">
                        <span class="font-bold text-primary text-sm">$${Number(item.price).toFixed(2)}</span>
                        <button onclick="addToCart(${escapeHtml(JSON.stringify(String(item.id)))})" class="bg-green-50 hover:bg-primary hover:text-white text-primary text-xs font-bold px-3 py-1.5 rounded-lg transition">
                            + Add
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterMenu(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white', 'shadow-sm');
                btn.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200');
            });
            event.target.classList.remove('bg-white', 'text-gray-600', 'border', 'border-gray-200');
            event.target.classList.add('bg-primary', 'text-white', 'shadow-sm');
            renderMenu(category);
        }

        // Cart Actions
        function addToCart(id) {
            const item = menuItems.find(i => String(i.id) === String(id));
            const existing = cart.find(i => String(i.id) === String(id));
            if (!item) return;
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function changeQty(id, delta) {
            const item = cart.find(i => String(i.id) === String(id));
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => String(i.id) !== String(id));
            }
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const itemsContainer = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');

            const totalCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            if (totalCount > 0) {
                badge.innerText = totalCount;
                badge.classList.remove('hidden');
                badge.classList.add('flex');
            } else {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }

            if (cart.length === 0) {
                itemsContainer.innerHTML = `<div class="text-center text-gray-400 py-8 text-sm">Your cart is empty 🛒</div>`;
            } else {
                itemsContainer.innerHTML = cart.map(item => {
                    const imgHtml = item.image.startsWith('http') || item.image.startsWith('images/')
                        ? `<img src="${escapeHtml(item.image)}" class="w-10 h-10 object-contain rounded">`
                        : `<span class="text-2xl">${escapeHtml(item.image)}</span>`;
                    return `
                    <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl">
                        <div class="flex items-center space-x-2">
                            ${imgHtml}
                            <div>
                                <h5 class="font-medium text-sm text-gray-800">${escapeHtml(item.name)}</h5>
                                <span class="text-xs text-primary font-bold">$${(item.price * item.qty).toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 bg-white px-2 py-1 rounded-lg border border-gray-200">
                            <button onclick="changeQty(${item.id}, -1)" class="text-gray-500 font-bold px-1">-</button>
                            <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="text-gray-500 font-bold px-1">+</button>
                        </div>
                    </div>
                `;
                }).join('');
            }
            totalEl.innerText = `$${totalPrice.toFixed(2)}`;
            syncTelegramUI();
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
            syncTelegramUI();
        }

        function togglePaymentUI() {
            const paymentType = document.querySelector('input[name="payment"]:checked').value;
            const qrBox = document.getElementById('qr-payment-box');
            if (paymentType === 'qr') {
                qrBox.classList.remove('hidden');
            } else {
                qrBox.classList.add('hidden');
            }
        }

        // Checkout
        async function checkout() {
            if (cart.length === 0) {
                notify('Your cart is empty!', 'warning');
                return;
            }

            const name = document.getElementById('customer-name').value.trim();
            const commMethod = document.getElementById('comm-method').value;
            const contact = document.getElementById('customer-contact').value.trim();
            const location = document.getElementById('customer-location').value.trim();
            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

            if (!name || !contact || !location) {
                notify('Please fill in your name, contact, and delivery location.', 'error');
                return;
            }

            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const payload = { name, commMethod, contact, location, paymentMethod, items: [...cart], total: totalPrice };
            let orderId = Math.floor(1000 + Math.random() * 9000);

            if (tg?.initData) {
                try {
                    const response = await apiFetch('/api/order', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({ initData: tg.initData, ...payload })
                    });
                    orderId = response.id;
                } catch (error) {
                    notify(`Could not send your order: ${error.message}`, 'error');
                    return;
                }
            }

            const newOrder = {
                id: orderId,
                name,
                commMethod,
                contact,
                location,
                paymentMethod,
                items: [...cart],
                total: totalPrice,
                telegram: tgUser,
                status: 'Received', // Received, On the way, Arrived, Delivered
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            orders.unshift(newOrder);
            saveOrders();

            // Set active order tracker
            activeOrderId = orderId;
            localStorage.setItem('firma_active_order', orderId);

            cart = [];
            updateCartUI();
            toggleCart();
            checkActiveTracker();

            notify(`Order #${orderId} placed successfully!`, 'success');
        }

        let statusSyncBusy = false;
        async function syncRemoteOrder() {
            if (!tg?.initData || !activeOrderId || statusSyncBusy) return;
            statusSyncBusy = true;
            try {
                const data = await apiFetch(`/api/my-orders?initData=${encodeURIComponent(tg.initData)}`);
                const remote = (data.orders || []).find(order => order.id == activeOrderId);
                if (remote) {
                    const local = orders.find(order => order.id == activeOrderId);
                    if (!local) {
                        orders.unshift(remote);
                        saveOrders();
                    } else if (local.status !== remote.status) {
                        local.status = remote.status;
                        saveOrders();
                    }
                    checkActiveTracker();
                }
            } catch (error) {
                console.error('status sync failed', error);
            } finally {
                statusSyncBusy = false;
            }
        }

        // Active Order Tracker UI
        function checkActiveTracker() {
            const tracker = document.getElementById('active-order-tracker');
            if (!activeOrderId) {
                tracker.classList.add('hidden');
                return;
            }

            const order = orders.find(o => o.id == activeOrderId);
            if (!order) {
                tracker.classList.add('hidden');
                return;
            }

            tracker.classList.remove('hidden');
            document.getElementById('tracker-id').innerText = order.id;
            document.getElementById('tracker-status-badge').innerText = order.status;

            // Update steps progress bar
            const steps = ['Received', 'On the way', 'Arrived', 'Delivered'];
            const currentIndex = steps.indexOf(order.status);
            const percent = (currentIndex / (steps.length - 1)) * 100;
            document.getElementById('progress-line').style.width = percent + '%';
        }

        function clearActiveOrder() {
            activeOrderId = null;
            localStorage.removeItem('firma_active_order');
            document.getElementById('active-order-tracker').classList.add('hidden');
        }

        // Initialize store view on load
        renderMenu();
        checkActiveTracker();
        syncRemoteMenu();

        // Auto-refresh tracker/orders every 3 seconds for real-time simulation
        setInterval(() => {
            orders = JSON.parse(localStorage.getItem('firma_orders')) || orders;
            checkActiveTracker();
            syncRemoteOrder();
            syncRemoteMenu();
        }, 3000);
    </script>
</body>
</html>
